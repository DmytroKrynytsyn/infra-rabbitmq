apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-rabbitmq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DmytroKrynytsyn/infra-rabbitmq.git
    targetRevision: HEAD
    path: helm/rabbitmq
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace: true